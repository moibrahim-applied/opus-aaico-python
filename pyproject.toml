[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opus-aaico"
version = "0.1.2"
description = "Unofficial Python SDK for the OPUS workflow automation platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "AAICO", email = "support@aaico.com" },
]
keywords = ["opus", "workflow", "automation", "ai", "sdk", "aaico"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://opus.com"
Documentation = "https://docs.opus.com/sdk/python"
Repository = "https://github.com/aaico/opus-aaico-python"

[tool.hatch.build.targets.wheel]
packages = ["src/opus_aaico"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
